name: Release Package

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Umbraco.Community.SmartRedirectSuggester/Client/package-lock.json

      - name: Set package version variables
        shell: bash
        run: |
          echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "PACKAGE_ID=Umbraco.Community.SmartRedirectSuggester" >> "$GITHUB_ENV"

      - name: Update Umbraco package manifest version
        shell: pwsh
        run: |
          $manifestPath = 'src/Umbraco.Community.SmartRedirectSuggester/Client/public/umbraco-package.json'
          $manifest = Get-Content $manifestPath | ConvertFrom-Json
          $packageVersion = '${{ env.PACKAGE_VERSION }}'

          function Add-PackageVersionToManifestFiles {
            param(
              [Parameter(Mandatory = $true)]
              [object]$Node
            )

            if ($null -eq $Node) {
              return
            }

            if ($Node -is [System.Collections.IEnumerable] -and $Node -isnot [string]) {
              foreach ($item in $Node) {
                Add-PackageVersionToManifestFiles -Node $item
              }
              return
            }

            foreach ($property in $Node.PSObject.Properties) {
              $value = $property.Value

              if ($value -is [string] -and $property.Name -in @('js', 'css')) {
                $separator = if ($value.Contains('?')) { '&' } else { '?' }
                $property.Value = "$value$separatorpackageversion=$packageVersion"
                continue
              }

              if ($value -is [System.Collections.IEnumerable] -and $value -isnot [string]) {
                $updatedValues = @()
                foreach ($item in $value) {
                  if ($item -is [string] -and $property.Name -in @('js', 'css')) {
                    $separator = if ($item.Contains('?')) { '&' } else { '?' }
                    $updatedValues += "$item$separatorpackageversion=$packageVersion"
                  } else {
                    Add-PackageVersionToManifestFiles -Node $item
                    $updatedValues += $item
                  }
                }
                $property.Value = $updatedValues
                continue
              }

              Add-PackageVersionToManifestFiles -Node $value
            }
          }

          $manifest.version = $packageVersion
          Add-PackageVersionToManifestFiles -Node $manifest
          $manifest | ConvertTo-Json -Depth 10 | Set-Content $manifestPath

      - name: Install client dependencies
        run: npm ci
        working-directory: src/Umbraco.Community.SmartRedirectSuggester/Client

      - name: Build client
        run: npm run build
        working-directory: src/Umbraco.Community.SmartRedirectSuggester/Client

      - name: Pack NuGet package
        run: dotnet pack src/Umbraco.Community.SmartRedirectSuggester/Umbraco.Community.SmartRedirectSuggester.csproj -c Release /p:Version=${{ env.PACKAGE_VERSION }} /p:PackageVersion=${{ env.PACKAGE_VERSION }} -o artifacts

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -vx "${GITHUB_REF_NAME}" | head -n 1 || true)
          if [ -n "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log "$PREVIOUS_TAG..${GITHUB_REF_NAME}" --pretty=format:'- %s')
          else
            CHANGELOG=$(git log --pretty=format:'- %s')
          fi
          {
            echo 'body<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.PACKAGE_ID }} ${{ env.PACKAGE_VERSION }}
          body: ${{ steps.changelog.outputs.body }}
          files: artifacts/*.nupkg
